[project]
name = "local-ai-studio"
version = "0.1.0"
description = "Chat local + herramientas para agentes sobre Ollama (texto) y mflux (imagen)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "mcp>=1.2,<2",
]

# Sin instalación editable: en carpetas sincronizadas con iCloud macOS marca los
# .pth como ocultos y Python 3.13 los ignora. Se ejecuta con `python -m localai.*`
# desde bin/, que no depende de ello.
[tool.uv]
package = false
