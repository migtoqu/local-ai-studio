<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI Studio</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6b64; --line: #e4e1db;
    --accent: #2f6b4f; --accent-ink: #ffffff; --user: #ecebe6; --warn: #a2471f; --think: #f1efe9;
    --radius: 14px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1c1a; --ink: #ecebe6; --muted: #9b968d; --line: #2e2c29;
            --accent: #5fae86; --accent-ink: #0d1a13; --user: #2a2926; --warn: #e48a5f; --think: #232220; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
         display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
  button, select, input, textarea { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 650; margin: 0 8px 0 0; letter-spacing: -0.01em; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--bg); }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; max-width: 240px; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; cursor: pointer; }
  .spacer { flex: 1; }
  .ghost { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  .ghost:hover { background: var(--bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--accent); } .dot.bad { background: var(--warn); }
  #status { font-size: 13px; color: var(--muted); }

  main { overflow-y: auto; }
  #log { max-width: 820px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: var(--radius); max-width: 100%; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); max-width: 85%; white-space: pre-wrap; }
  .assistant .bubble { padding-left: 0; padding-right: 0; }
  .meta { font-size: 12px; color: var(--muted); }
  .bubble pre { background: var(--think); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font: 13px/1.5 var(--mono); }
  .bubble code { font-family: var(--mono); font-size: .92em; }
  .bubble p { margin: 0 0 .7em; } .bubble p:last-child { margin-bottom: 0; }
  details.think { background: var(--think); border-radius: 10px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  details.think summary { cursor: pointer; }
  details.think div { white-space: pre-wrap; margin-top: 6px; max-height: 260px; overflow-y: auto; }
  .error { color: var(--warn); white-space: pre-wrap; font: 13px/1.5 var(--mono); }
  .imgcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; max-width: 560px; }
  .imgcard img { width: 100%; border-radius: 10px; display: block; }
  .imgcard .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .imgcard a { color: var(--accent); }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .progress.indeterminate > div { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .progress.indeterminate > div { animation: none; width: 100%; opacity: .4; } }

  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty h2 { color: var(--ink); font-size: 22px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px 16px; }
  .composer { max-width: 820px; margin: 0 auto; }
  .imgopts { display: none; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  body.image-mode .imgopts { display: flex; }
  .imgopts input { width: 96px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 8px; }
  .box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--bg); }
  .box:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; max-height: 200px; padding: 6px; }
  .send { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
  .send:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: center; }

  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink); width: min(920px, 94vw); max-height: 86vh; padding: 0; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 16px; }
  .grid img { width: 100%; border-radius: 10px; display: block; }
  textarea { min-width: 0; }
  @media (max-width: 640px) {
    header { padding: 8px 16px; gap: 8px; } header h1, .spacer, #status { display: none; }
    #log, footer { padding-left: 16px; padding-right: 16px; }
    select { max-width: 100%; min-width: 0; flex: 1 1 120px; }
    .ghost { padding: 5px 10px; }
    .imgopts input { width: 84px; }
  }
</style>
</head>
<body>
<header>
  <h1>Local AI Studio</h1>
  <div class="seg" role="group" aria-label="Modo">
    <button id="modeText" aria-pressed="true">Texto</button>
    <button id="modeImage" aria-pressed="false">Imagen</button>
  </div>
  <select id="textModel" aria-label="Modelo de texto"></select>
  <select id="imageModel" aria-label="Modelo de imagen" hidden></select>
  <label class="toggle" id="thinkWrap"><input type="checkbox" id="think"> Razonar</label>
  <span class="spacer"></span>
  <span id="status"><span class="dot"></span>Comprobando…</span>
  <button class="ghost" id="galleryBtn">Galería</button>
  <button class="ghost" id="newChat">Nuevo chat</button>
</header>

<main id="scroller"><div id="log"></div></main>

<footer>
  <div class="composer">
    <div class="imgopts">
      <span>Formato</span>
      <div class="seg" role="group" aria-label="Formato">
        <button data-size="768x512" aria-pressed="true">Horizontal</button>
        <button data-size="640x640" aria-pressed="false">Cuadrado</button>
        <button data-size="512x768" aria-pressed="false">Vertical</button>
      </div>
      <label>Semilla <input id="seed" type="number" placeholder="aleatoria"></label>
      <button class="ghost" id="enhance" title="Reescribe tu idea como prompt detallado en inglés usando el modelo de texto">Mejorar prompt</button>
    </div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Escribe un mensaje…"></textarea>
      <button class="send" id="send">Enviar</button>
    </div>
    <div class="hint" id="hint">Enter para enviar · Shift+Enter nueva línea · todo se ejecuta en tu ordenador</div>
  </div>
</footer>

<dialog id="gallery">
  <div class="dlg-head"><strong>Imágenes generadas</strong><button class="ghost" id="closeGallery">Cerrar</button></div>
  <div class="grid" id="grid"></div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send"), scroller = $("#scroller");
const STORE = "localai.chat.v1";
let mode = "text", busy = false, size = "768x512";
let history = load();

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(history)); } catch {} }

// ---------- mini markdown (escape + bloques de código + negrita + párrafos)
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function md(src) {
  const parts = src.split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let html = "";
  for (let i = 0; i < parts.length; i += 3) {
    const text = esc(parts[i])
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/^#{1,6} (.*)$/gm, "<strong>$1</strong>")
      .replace(/^(\s*)[-*] (.*)$/gm, (_, sp, t) => `${sp.length ? "&nbsp;&nbsp;&nbsp;" : ""}• ${t}`)
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
    html += text.split(/\n{2,}/).filter((p) => p.trim()).map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
    if (parts[i + 2] !== undefined) html += `<pre><code>${esc(parts[i + 2])}</code></pre>`;
  }
  return html;
}

// ---------- render
function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

function renderEmpty() {
  log.innerHTML = "";
  const e = el("div", "empty");
  e.innerHTML = `<h2>${mode === "text" ? "Chatea con tu modelo local" : "Genera imágenes en local"}</h2>
    <div>${mode === "text" ? "Sin internet, sin claves, sin coste." : "Puede tardar unos minutos por imagen en un Mac de 8 GB."}</div>`;
  const chips = el("div", "chips");
  const ideas = mode === "text"
    ? ["Escribe la ficha de venta de una yegua PRE torda de 6 años", "Dame 5 nombres para una cuadra de caballos andaluces", "Explica la diferencia entre doma clásica y doma vaquera"]
    : ["Yegua PRE torda trotando en un picadero, luz dorada", "Retrato de un semental frisón negro en un establo", "Potro alazán en un prado verde al amanecer"];
  ideas.forEach((t) => { const b = el("button", "", esc(t)); b.onclick = () => { input.value = t; autosize(); input.focus(); }; chips.append(b); });
  e.append(chips); log.append(e);
}

function addUser(text) { const m = el("div", "msg user"); m.append(el("div", "bubble", esc(text))); log.append(m); return m; }

function addAssistant() {
  const m = el("div", "msg assistant");
  const think = el("details", "think"); think.innerHTML = "<summary>Razonamiento</summary><div></div>"; think.hidden = true;
  const bubble = el("div", "bubble"); const meta = el("div", "meta");
  m.append(think, bubble, meta); log.append(m);
  return { m, think, thinkBody: think.querySelector("div"), bubble, meta };
}

function addImageCard(item) {
  const m = el("div", "msg assistant");
  const card = el("div", "imgcard");
  m.append(card); log.append(m);
  if (item.url) fillImageCard(card, item);
  return card;
}
function fillImageCard(card, item) {
  card.innerHTML = `<a href="${item.url}" target="_blank"><img src="${item.url}" alt="${esc(item.prompt || "")}"></a>
    <div class="row"><span>${esc(item.meta || "")}</span><a href="${item.url}" download>Descargar</a></div>`;
}

function renderHistory() {
  if (!history.length) return renderEmpty();
  log.innerHTML = "";
  for (const h of history) {
    if (h.role === "user") addUser(h.content);
    else if (h.role === "image") addImageCard(h);
    else { const a = addAssistant(); a.bubble.innerHTML = md(h.content); a.meta.textContent = h.meta || ""; }
  }
  scrollDown();
}

// ---------- streaming ndjson
async function* stream(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  while (true) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) yield JSON.parse(line); }
  }
}

// ---------- acciones
async function sendText(text) {
  history.push({ role: "user", content: text }); addUser(text); save();
  const a = addAssistant(); a.bubble.innerHTML = '<span class="meta">Cargando modelo…</span>'; scrollDown();
  const messages = history.filter((h) => h.role === "user" || h.role === "assistant").map(({ role, content }) => ({ role, content }));
  let content = "", thinking = "", meta = "", started = performance.now();
  try {
    for await (const ev of stream("/api/chat", { messages, model: $("#textModel").value || null, think: $("#think").checked })) {
      if (ev.type === "thinking") { thinking += ev.text; a.think.hidden = false; a.thinkBody.textContent = thinking; if (!content) a.bubble.innerHTML = '<span class="meta">Razonando…</span>'; }
      else if (ev.type === "content") { content += ev.text; a.bubble.innerHTML = md(content); }
      else if (ev.type === "model") meta = ev.model;
      else if (ev.type === "done") meta += ` · ${ev.tokens} tokens · ${ev.tokens_per_second ?? "?"} tok/s · ${((performance.now() - started) / 1000).toFixed(1)} s`;
      else if (ev.type === "error") throw new Error(ev.message);
      scrollDown();
    }
    a.meta.textContent = meta;
    history.push({ role: "assistant", content, meta }); save();
  } catch (e) {
    a.bubble.innerHTML = `<div class="error">${esc(String(e.message || e))}</div>`;
    history.pop(); save();
  }
}

async function sendImage(prompt) {
  history.push({ role: "user", content: prompt }); addUser(prompt); save();
  const [width, height] = size.split("x").map(Number);
  const seedVal = $("#seed").value ? Number($("#seed").value) : null;
  const card = addImageCard({});
  card.innerHTML = `<div class="meta" id="pstat">En cola…</div><div class="progress indeterminate"><div></div></div><div class="meta" id="ptime"></div>`;
  const pstat = card.querySelector("#pstat"), bar = card.querySelector(".progress"), ptime = card.querySelector("#ptime");
  pstat.removeAttribute("id"); ptime.removeAttribute("id");
  const t0 = performance.now(); const timer = setInterval(() => { ptime.textContent = `${Math.round((performance.now() - t0) / 1000)} s`; }, 1000);
  scrollDown();
  try {
    for await (const ev of stream("/api/image", { prompt, model: $("#imageModel").value, width, height, seed: seedVal })) {
      if (ev.type === "started") pstat.textContent = "Cargando modelo de imagen (la primera vez descarga ~4 GB)…";
      else if (ev.type === "log") pstat.textContent = ev.text;
      else if (ev.type === "progress") { bar.classList.remove("indeterminate"); bar.firstChild.style.width = `${(ev.step / ev.total) * 100}%`; pstat.textContent = `Paso ${ev.step} de ${ev.total}`; }
      else if (ev.type === "error") throw new Error(ev.message);
      else if (ev.type === "done") {
        const secs = Math.round((performance.now() - t0) / 1000);
        const item = { role: "image", url: ev.url, prompt, meta: `${$("#imageModel").selectedOptions[0].textContent} · ${width}×${height} · ${secs} s` };
        fillImageCard(card, item); history.push(item); save();
      }
      scrollDown();
    }
  } catch (e) {
    card.innerHTML = `<div class="error">${esc(String(e.message || e))}</div>`;
  } finally { clearInterval(timer); }
}

async function send() {
  const text = input.value.trim(); if (!text || busy) return;
  if (!history.length) log.innerHTML = "";
  input.value = ""; autosize(); setBusy(true);
  try { mode === "text" ? await sendText(text) : await sendImage(text); } finally { setBusy(false); input.focus(); }
}

async function enhance() {
  const idea = input.value.trim(); if (!idea || busy) return;
  setBusy(true); $("#enhance").textContent = "Mejorando…";
  try {
    const res = await fetch("/api/text", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      prompt: idea, model: $("#textModel").value || null, temperature: 0.7, max_tokens: 200,
      system: "Rewrite the user's idea as a single detailed English prompt for a photorealistic text-to-image model. Include subject, setting, lighting, camera and style. Output only the prompt, no quotes." }) });
    const data = await res.json(); if (!res.ok) throw new Error(data.detail || res.status);
    input.value = data.text; autosize();
  } catch (e) { alert("No se pudo mejorar el prompt: " + e.message); }
  finally { $("#enhance").textContent = "Mejorar prompt"; setBusy(false); }
}

function setBusy(v) { busy = v; sendBtn.disabled = v; }
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; }

function setMode(m) {
  mode = m; document.body.classList.toggle("image-mode", m === "image");
  $("#modeText").setAttribute("aria-pressed", m === "text"); $("#modeImage").setAttribute("aria-pressed", m === "image");
  $("#imageModel").hidden = m !== "image"; $("#thinkWrap").hidden = m !== "text";
  input.placeholder = m === "text" ? "Escribe un mensaje…" : "Describe la imagen (mejor en inglés, o usa «Mejorar prompt»)…";
  sendBtn.textContent = m === "text" ? "Enviar" : "Generar";
  if (!history.length) renderEmpty();
}

// ---------- estado
async function refreshStatus() {
  const st = $("#status");
  try {
    const s = await (await fetch("/api/status")).json();
    const tm = $("#textModel"), prev = tm.value;
    tm.innerHTML = s.ollama.models.length ? s.ollama.models.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("") : '<option value="">(sin modelos)</option>';
    const pref = s.preferred_text_models.find((m) => s.ollama.models.includes(m));
    tm.value = s.ollama.models.includes(prev) ? prev : (pref || s.ollama.models[0] || "");
    const im = $("#imageModel"), prevI = im.value;
    im.innerHTML = s.image_models.map((m) => `<option value="${m.key}" ${m.installed ? "" : "disabled"}>${esc(m.label)}${m.weights_cached ? "" : " · se descargará"}</option>`).join("");
    im.value = prevI || s.image_models.find((m) => m.default)?.key;
    const ok = s.ollama.ok;
    st.innerHTML = `<span class="dot ${ok ? "ok" : "bad"}"></span>${ok ? `Ollama · ${s.ollama.models.length} modelo(s)` : "Ollama apagado"}`;
    st.title = s.ollama.error || "";
  } catch { st.innerHTML = '<span class="dot bad"></span>Servidor no disponible'; }
}

async function openGallery() {
  const grid = $("#grid"); grid.innerHTML = '<div class="meta">Cargando…</div>'; $("#gallery").showModal();
  const items = await (await fetch("/api/images")).json();
  grid.innerHTML = items.length ? items.map((i) => `<a href="${i.url}" target="_blank"><img loading="lazy" src="${i.url}" alt="${esc(i.name)}"></a>`).join("") : '<div class="meta">Aún no hay imágenes.</div>';
}

// ---------- eventos
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
sendBtn.onclick = send;
$("#enhance").onclick = enhance;
$("#modeText").onclick = () => setMode("text");
$("#modeImage").onclick = () => setMode("image");
$("#newChat").onclick = () => { if (busy) return; history = []; save(); renderEmpty(); input.focus(); };
$("#galleryBtn").onclick = openGallery;
$("#closeGallery").onclick = () => $("#gallery").close();
document.querySelectorAll("[data-size]").forEach((b) => b.onclick = () => {
  size = b.dataset.size; document.querySelectorAll("[data-size]").forEach((x) => x.setAttribute("aria-pressed", x === b));
});

refreshStatus(); setInterval(refreshStatus, 15000);
setMode("text"); renderHistory(); input.focus();
</script>
</body>
</html>
